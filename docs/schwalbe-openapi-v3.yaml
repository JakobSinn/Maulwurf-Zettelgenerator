paths:
    /commitments:
        summary: Path used to manage the list of commitments.
        description: ""
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Commitment"
                    description: Successful response - returns an array of `Commitment` entities.
            operationId: getCommitments
            summary: List all commitments
            description: |
                List all `Commitment` objects that are currently relevant, ordered ascendingly by the date the commitment was made.

                ## Order

                The earliest commitment will appear as first entry in the list. This corresponds to the voting slip, where the earliest candidacy will also be listed on top. Note that we apply this order globally across all commitments (because it is simpler to do and because we can, after all, time is a global concept), but the order is only relevant for commitments that have an election, within that praticular election – commitments from different elections (or without an election) will never be placed on the same voting slip, so it
                doesn't really matter which one was made first.

                ## Relevance

                A commitment can only be relevant if it meets both of the following criteria:

                * **It is confirmed.** If the commitment was made via a web form, this allows the entrant to revert their decision by not clicking the confirmation link in the mail they receive after filling out the form.
                * **The office period start and end are set.** Otherwise, the following rules cannot work properly.

                Furthermore, it must also meet at least one of the following criteria. Then (and only then) is a commitment relevant.

                * **Its enterStatus is one of {`"regular"`, `"stepped_in"`, `"substitute"`, `"resigned"`, `"unelected"`, `"unenrolled"`} and today ≤ `office.end`**.
                    * Reason: We want to display all office holders during their office period, as soon as we know that they will be office holders.
                * **Its enterStatus is one of {`"pending"`, `"denied"`} and today ≤ min(`office.start` + 2 months, `office.end`)**.
                    * Reason: We want to display all candidates before an election, and all candidates (elected and non-elected) for a while after the election. However, we redact them earlier for privacy reasons, as they cease to be relevant after a while.
    /commitments/{uuid}:
        summary: Path used to manage a single commitment.
        description: ""
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Commitment"
                    description: Successful response - returns a single `Commitment`.
                "404":
                    description: |
                        Error response. Might appear for two reasons:

                        1. There exists no commitment with this uuid
                        2. There exists a commitment with this uuid, but it is not relevant.

                        For a detailed explanation of the relevance criteria, see the `/commitments` endpoint.
            operationId: getCommitment
            summary: Get a commitment
            description: Get a single instance of a `Commitment`, if it is relevant.
        parameters:
            - examples:
                  a_uuid:
                      value: eda991d4-02eb-452b-89db-f3bacc7d2e37
              name: uuid
              description: A unique identifier for a commitment.
              schema:
                  type: string
              in: path
              required: true
            - $ref: "#/components/parameters/dereference"
    /persons/self:
        summary: Path used to manage oneself.
        description: ""
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Person"
                    description: Successful response - returns a single `Person`.
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "404":
                    description: |
                        Error response. Might appear for two reasons:

                        1. The current user has no Uni ID set
                        2. There is no person with the Uni ID of the user
            operationId: getSelf
            summary: Get self
            description: Get the single `Person` instance associated with the current user. Authorization is required.
            security:
                - secretBearerAuth: []
    /certifications/{id}:
        summary: Path used to manage a commitment certification
        description: ""
        get:
            operationId: getCertification
            summary: Get a commitment certification
            description: |
                Return the latest version of the commitment certification with the given Certification ID in PDF format.
            responses:
                "200":
                    description: A PDF file containing a commitment certification.
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
                "400":
                    description: The certificationId parameter is not well-formed.
                "404":
                    description: There is no such certification
            parameters:
                - name: id
                  description: A Certification ID
                  schema:
                      type: string
                  in: path
                  required: true
                - in: query
                  name: language
                  schema:
                      type: string
                      enum: ["de", "en"]
                      default: "de"
                  description: The language of the certification.
    /certification-requests:
        summary: Path used to manage certification requests.
        description: ""
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CertificationRequest"
                        examples:
                            request_certifications:
                                value:
                                    uniId: jb007
            responses:
                "201":
                    description: The certifications have been requested. The application will asynchronously process the request and send them via mail.
                "400":
                    $ref: "#/components/responses/BadRequestError"
            operationId: createCertificationRequest
            summary: Cerate commitment certification request
            description: Request all commitment certifications for the person with the given Uni ID to be sent via mail to that person.
