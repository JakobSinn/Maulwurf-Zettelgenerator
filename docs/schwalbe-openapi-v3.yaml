---
openapi: 3.1.1
info:
    title: Schwalbe API
    version: 3.0.0-beta.8
    description: |-
        > **🌊 Fluctuating API:** APIv3 is still in beta, and may be subject to breaking change. While the core concepts (commitments, offices, subjects, elections) should be relatively stable, there could be fields added or removed, or occasionally even conceptual changes.
        >
        > This situation is of course not ideal, but the best we can do given our personnel resources.
        >
        > **If you're building something based on this API, please contact the [corresponding author](https://schwalbe.stura.uni-heidelberg.de/about)**, so we can make sure to not break features you need.

        An API to access data about offices, office holders and elections concerning the Verfasste Studierendenschaft of the Universität Heidelberg.

        ### First steps

        If this is your first time using the API, we recommend two things:

        1. Read the [model documentation](https://gitlab.com/schwalbe-hd/schwalbe/-/blob/master/docs/model.md?ref_type=heads) first. It gives a high level overview over what this API does, and should hopefully make reading these docs a bit easier. It is also short.
        2. Send a mail to the [corresponding author](https://schwalbe.stura.uni-heidelberg.de/about) to register your API usage. This is completely optional and voluntary, but will help us to notify you if we plan breaking changes to the API (and maybe even consider not doing them, if we know someone else is depending on it).

        ### Etymology

        The German name of this API is “**Sch**nittstelle zur **Wa**h**l**daten**be**reitstellung” (“Interface for election data provision”) or “Schwalbe” (“swallow”, the bird) for short. Believe us, it's funny in German.
