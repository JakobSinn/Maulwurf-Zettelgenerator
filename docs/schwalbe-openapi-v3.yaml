            operationId: getElections
            summary: List all elections
            description: |
                List all `Election` entities ever recorded.

                Some of the result data is only shown when it is relevant, and otherwise redacted for privacy reasons.

                ## Relevance

                * **When today > `legislativePeriod.end`, the result is irrelevant (and `result` therefore set to `null`).**
                    * Reason: As soon as the legislative period is over, all commitments become irrelevant and are not shown. Therefore it also doesn't make much sense to show commitment votes referencing (seemingly) non-existent commitments.
                * **When today > min(`legislativePeriod.start` + 2 months, `legislativePeriod.end`), the vote counts are irrelevant (and `votes` therefore set to `null`).**
                    * Reason: We want to protect the candidates' privacy by not showing the exact number of votes longer than necessary.
